version: 2

models:

  - name: fct_vendas
    description: "Tabela fato contendo todas as vendas enriquecidas com informações de clientes, produtos e estornos."

    columns:

      - name: purchase_id
        description: "Identificador único da venda."
        tests:
          - unique
          - not_null

      - name: customer_id
        description: "Identificador do cliente."

      - name: customer_name
        description: "Nome completo do cliente."

      - name: customer_email
        description: "E-mail do cliente."

      - name: product_id
        description: "Identificador do produto."

      - name: product_name
        description: "Nome do produto."

      - name: product_price
        description: "Preço unitário do produto."

      - name: purchase_date
        description: "Data da compra."

      - name: quantity
        description: "Quantidade adquirida."

      - name: total_price
        description: "Valor bruto da venda."

      - name: payment_method
        description: "Forma de pagamento."

      - name: refund_amount
        description: "Valor reembolsado ao cliente."

      - name: refund_reason
        description: "Motivo do estorno."

      - name: net_revenue
        description: "Receita líquida da venda após dedução de estornos."