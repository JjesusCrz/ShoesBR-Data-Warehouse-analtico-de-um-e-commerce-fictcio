version: 2

models:

  - name: int_clientes
    description: "Modelo intermediário consolidando clientes com indicadores de compras."

    columns:

      - name: customer_id
        description: "Identificador único do cliente."
        tests:
          - unique
          - not_null

      - name: customer_name
        description: "Nome do cliente."

      - name: customer_address
        description: "Endereço do cliente."

      - name: customer_phone
        description: "Telefone do cliente."

      - name: customer_email
        description: "E-mail do cliente."

      - name: total_gasto
        description: "Valor total gasto pelo cliente."
        tests:
          - not_null

      - name: total_compras
        description: "Quantidade total de compras realizadas pelo cliente."
        tests:
          - not_null

  - name: int_produtos
    description: "Modelo intermediário consolidando produtos com métricas de vendas."

    columns:

      - name: product_id
        description: "Identificador único do produto."
        tests:
          - unique
          - not_null

      - name: product_name
        description: "Nome do produto."

      - name: product_price
        description: "Preço unitário do produto."

      - name: total_vendido
        description: "Quantidade total vendida."
        tests:
          - not_null

      - name: total_faturado
        description: "Valor total faturado pelo produto."
        tests:
          - not_null

  - name: int_vendas
    description: "Modelo intermediário consolidando vendas com informações de estornos."

    columns:

      - name: purchase_id
        description: "Identificador único da venda."
        tests:
          - unique
          - not_null

      - name: customer_id
        description: "Identificador do cliente."

      - name: product_id
        description: "Identificador do produto."

      - name: purchase_date
        description: "Data da compra."

      - name: quantity
        description: "Quantidade comprada."

      - name: total_price
        description: "Valor total da venda."

      - name: payment_method
        description: "Forma de pagamento."

      - name: refund_amount
        description: "Valor reembolsado ao cliente."

      - name: refund_reason
        description: "Motivo do estorno."

  - name: int_estorno
    description: "Modelo intermediário contendo os registros de estornos."

    columns:

      - name: purchase_id
        description: "Identificador da compra."

      - name: customer_id
        description: "Identificador do cliente."

      - name: product_id
        description: "Identificador do produto."

      - name: refund_date
        description: "Data do estorno."

      - name: refund_reason
        description: "Motivo do estorno."

      - name: refund_amount
        description: "Valor reembolsado."